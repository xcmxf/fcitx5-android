name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64
    steps:
      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install build dependencies
        run: |
          sdkmanager --install "cmake;3.31.6"
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test floating keyboard bounds
        if: matrix.abi == 'x86_64'
        run: ./gradlew :app:testDebugUnitTest --tests org.fcitx.fcitx5.android.input.FloatingKeyboardBoundsTest -PbuildABI=${{ matrix.abi }}

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PbuildABI=${{ matrix.abi }}

      - name: Sign release APK
        run: |
          base64 -d .github/nightly-debug.keystore.b64 > nightly-debug.keystore

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "${APKSIGNER}" ]; then
            sdkmanager --install "build-tools;36.0.0"
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          fi

          mkdir -p signed-apks
          for apk in app/build/outputs/apk/release/*-unsigned.apk
          do
            base="$(basename "${apk}")"
            signed="signed-apks/${base/-unsigned.apk/-debugsigned.apk}"
            "${APKSIGNER}" sign \
              --v4-signing-enabled false \
              --ks nightly-debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "${signed}" \
              "${apk}"
            "${APKSIGNER}" verify --verbose "${signed}"
          done

      - name: Upload app
        uses: actions/upload-artifact@v6
        with:
          name: app-release-${{ matrix.abi }}
          path: signed-apks/
