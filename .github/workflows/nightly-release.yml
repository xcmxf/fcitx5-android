name: Nightly Release

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Fork branch to sync and release"
        required: true
        default: "test-floating-keyboard-20260604-225446"
      upstream_branch:
        description: "Upstream branch to merge"
        required: true
        default: "master"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'test-floating-keyboard-20260604-225446' }}
  UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'master' }}
  UPSTREAM_REPO: fcitx5-android/fcitx5-android
  NOTIFY_USER: ${{ github.repository_owner }}

jobs:
  nightly:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_branch || 'test-floating-keyboard-20260604-225446' }}
          fetch-depth: 0
          submodules: recursive

      - name: Sync upstream
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git remote get-url upstream >/dev/null 2>&1
          then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi
          git fetch origin "${TARGET_BRANCH}"
          git fetch upstream "${UPSTREAM_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"

          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          echo "upstream_sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"
          if git merge-base --is-ancestor "${upstream_sha}" HEAD
          then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "conflict=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          set +e
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}" > merge-output.log 2>&1
          merge_status=$?
          set -e
          cat merge-output.log
          if [ "${merge_status}" -ne 0 ]
          then
            git diff --name-only --diff-filter=U > conflict-files.txt || true
            if [ ! -s conflict-files.txt ]
            then
              echo "(git did not report individual conflicted files)" > conflict-files.txt
            fi
            echo "Conflicting files:"
            cat conflict-files.txt
            git merge --abort || true
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "conflict=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git submodule sync --recursive
          git submodule update --init --recursive
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "conflict=false" >> "${GITHUB_OUTPUT}"

      - name: Open sync conflict PR
        if: steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Upstream sync conflict: ${{ env.TARGET_BRANCH }} <- ${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_BRANCH }}"
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        run: bash .github/scripts/open-upstream-conflict-pr.sh

      - name: Stop after sync conflict
        if: steps.sync.outputs.conflict == 'true'
        run: exit 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v3

      - name: Install build dependencies
        run: |
          sdkmanager --install "cmake;3.31.6"
          sudo apt update
          sudo apt install -y extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build nightly APKs
        run: |
          shopt -s nullglob

          collect_unsigned_apks() {
            local source_dir="$1"
            local target_dir="$2"
            local apks=("${source_dir}"/*-unsigned.apk)
            if [ "${#apks[@]}" -eq 0 ]; then
              echo "No unsigned APKs found in ${source_dir}" >&2
              exit 1
            fi
            cp "${apks[@]}" "${target_dir}/"
          }

          mkdir -p unsigned-assets/app unsigned-assets/swipe-futo
          for abi in arm64-v8a x86_64
          do
            rm -rf app/build/outputs/apk/release plugin/swipe-futo/build/outputs/apk/release
            ./gradlew :app:assembleRelease :plugin:swipe-futo:assembleRelease -PbuildABI="${abi}"
            collect_unsigned_apks app/build/outputs/apk/release unsigned-assets/app
            collect_unsigned_apks plugin/swipe-futo/build/outputs/apk/release unsigned-assets/swipe-futo
          done

      - name: Sign nightly APKs
        run: |
          base64 -d .github/nightly-debug.keystore.b64 > nightly-debug.keystore
          shopt -s nullglob

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "${APKSIGNER}" ]; then
            sdkmanager --install "build-tools;36.0.0"
            APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          fi

          sign_apks() {
            local input_dir="$1"
            local apks=("${input_dir}"/*-unsigned.apk)
            if [ "${#apks[@]}" -eq 0 ]; then
              echo "No unsigned APKs found in ${input_dir}" >&2
              exit 1
            fi
            mkdir -p release-assets
            for apk in "${apks[@]}"
            do
              base="$(basename "${apk}")"
              signed="release-assets/${base/-unsigned.apk/-debugsigned.apk}"
              "${APKSIGNER}" sign \
                --v4-signing-enabled false \
                --ks nightly-debug.keystore \
                --ks-pass pass:android \
                --key-pass pass:android \
                --out "${signed}" \
                "${apk}"
              "${APKSIGNER}" verify --verbose "${signed}"
            done
          }

          sign_apks unsigned-assets/app
          sign_apks unsigned-assets/swipe-futo

      - name: Prepare release notes
        run: |
          {
            echo "Nightly build from ${GITHUB_REPOSITORY}@$(git rev-parse --short HEAD)"
            echo
            echo "- Synced upstream: ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}"
            echo "- Target branch: ${TARGET_BRANCH}"
            echo "- Built ABIs: arm64-v8a, x86_64"
            echo "- Included artifacts: app, swipe-futo plugin"
            echo "- Signing: fixed nightly debug key"
            echo
            echo "Commit:"
            git log -1 --oneline
          } > release-notes.md

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          git push origin :refs/tags/nightly || true
          git tag -f nightly
          git push origin refs/tags/nightly --force
          gh release create nightly release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false
